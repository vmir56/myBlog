<!-- templates/blog/post_confirm_delete.html -->
{% extends 'blog/base.html' %}

{% block title %}Удаление поста{% endblock %}

{% block content %}
<div class="delete-confirm">
    <h1>Удаление поста</h1>
    
    <div class="warning-box">
        <p>Вы уверены, что хотите удалить пост <strong>"{{ object.title }}"</strong>?</p>
        <p class="warning">Это действие нельзя отменить!</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
            <a href="{% url 'blog:post_detail' object.pk %}" class="btn">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
