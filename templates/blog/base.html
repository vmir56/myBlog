{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мой блог{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">📝 Мой блог</h1>
            <nav>
                <a href="{% url 'blog:home' %}">Главная</a>
                <a href="{% url 'blog:about' %}">О нас</a>
                <a href="{% url 'blog:post_list' %}">Посты</a>
                <a href="{% url 'blog:post_create' %}" class="btn">➕ Новый пост</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Мой блог</p>
        </div>
    </footer>
</body>
</html>
